<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pdf Toolbox</title>
  
  <!-- Link ke Manifest PWA -->
  <link rel="manifest" href="manifest.json">
  
  <!-- Theme Color untuk status bar mobile -->
  <meta name="theme-color" content="#2563eb">
  
  <!-- Tailwind CSS untuk styling prompt instalasi -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden; /* Mencegah scroll ganda dengan iframe */
      background-color: #f3f4f6;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Iframe Aplikasi Google Apps Script -->
  <iframe src="https://script.google.com/macros/s/AKfycbzgSSp5fFerUAnC-cxNtIcxuZy7d-nDFIDM6SUNXXmigkO3ZMh6Rpja7lY9dZTzXdt7Tw/exec" allowfullscreen></iframe>

  <!-- Prompt/Iklan Instalasi (Disembunyikan secara default) -->
  <div id="install-prompt" class="hidden fixed bottom-4 left-4 right-4 bg-white rounded-xl shadow-2xl border border-gray-100 p-4 transform transition-transform duration-300 translate-y-full z-50">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-4">
        <!-- Tampilkan Ikon Aplikasi di dalam Banner -->
        <img src="URL_GAMBAR_ANDA_DISINI" alt="Pdf Toolbox Icon" class="w-12 h-12 rounded-lg shadow-sm">
        <div>
          <h3 class="text-sm font-bold text-gray-800">Install Pdf Toolbox</h3>
          <p class="text-xs text-gray-500">Akses lebih cepat dari layar utama Anda</p>
        </div>
      </div>
      <div class="flex flex-col space-y-2">
        <button id="install-btn" class="bg-blue-600 text-white text-xs font-semibold py-2 px-4 rounded-lg shadow hover:bg-blue-700 transition">Install</button>
        <button id="close-btn" class="text-gray-400 text-xs font-medium hover:text-gray-600 transition">Nanti</button>
      </div>
    </div>
  </div>

  <script>
    // 1. Registrasi Service Worker untuk kapabilitas PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(registration => console.log('ServiceWorker registered'))
          .catch(err => console.log('ServiceWorker registration failed: ', err));
      });
    }

    // 2. Logika Prompt Instalasi (PWA)
    let deferredPrompt;
    const installPromptUI = document.getElementById('install-prompt');
    const installBtn = document.getElementById('install-btn');
    const closeBtn = document.getElementById('close-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
      // Mencegah prompt bawaan Chrome muncul secara otomatis
      e.preventDefault();
      deferredPrompt = e;
      
      // Tampilkan UI Iklan/Saran Instalasi kustom kita dengan animasi
      installPromptUI.classList.remove('hidden');
      setTimeout(() => {
        installPromptUI.classList.remove('translate-y-full');
      }, 100);
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        // Tampilkan prompt bawaan sistem
        deferredPrompt.prompt();
        
        // Tunggu respon pengguna (menginstal atau membatalkan)
        const { outcome } = await deferredPrompt.userChoice;
        console.log(`User response to the install prompt: ${outcome}`);
        
        // Sembunyikan UI kita setelah interaksi
        installPromptUI.classList.add('translate-y-full');
        setTimeout(() => installPromptUI.classList.add('hidden'), 300);
        
        deferredPrompt = null;
      }
    });

    closeBtn.addEventListener('click', () => {
      installPromptUI.classList.add('translate-y-full');
      setTimeout(() => installPromptUI.classList.add('hidden'), 300);
    });

    // Sembunyikan prompt jika aplikasi sudah berhasil diinstal
    window.addEventListener('appinstalled', () => {
      installPromptUI.classList.add('hidden');
      console.log('Pdf Toolbox was installed.');
    });
  </script>
</body>
</html>
