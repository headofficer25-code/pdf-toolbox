<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pdf Toolbox</title>
  
  <!-- Favicon untuk Tab Browser -->
  <link rel="icon" type="image/png" href="https://cdn.phototourl.com/free/2026-09-15-9150f100-1206-4587-85bb-6716981d0b9f.png">
  
  <!-- Apple Touch Icon untuk iPhone/iPad -->
  <link rel="apple-touch-icon" href="https://cdn.phototourl.com/free/2026-09-15-9150f100-1206-4587-85bb-6716981d0b9f.png">
  
  <!-- Tag ini akan diisi URL Manifest secara dinamis oleh JavaScript -->
  <link id="manifest-link" rel="manifest" href="">
  
  <!-- Theme Color -->
  <meta name="theme-color" content="#2563eb">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #f3f4f6;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Iframe Aplikasi GAS -->
  <iframe src="https://script.google.com/macros/s/AKfycbzgSSp5fFerUAnC-cxNtIcxuZy7d-nDFIDM6SUNXXmigkO3ZMh6Rpja7lY9dZTzXdt7Tw/exec" allowfullscreen></iframe>

  <!-- Prompt/Saran Instalasi ala Pop-up E-commerce -->
  <div id="install-prompt-overlay" class="hidden fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center transition-opacity duration-300 opacity-0">
    <div id="install-prompt-box" class="bg-white rounded-2xl shadow-2xl p-6 mx-4 w-full max-w-xs transform transition-all duration-300 scale-90 text-center relative">
      
      <!-- Tombol Close (X) di pojok -->
      <button id="close-icon-btn" class="absolute top-3 right-3 text-gray-400 hover:text-gray-700 transition">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>

      <!-- Konten Iklan -->
      <img src="https://cdn.phototourl.com/free/2026-09-15-9150f100-1206-4587-85bb-6716981d0b9f.png" alt="Pdf Toolbox Icon" class="w-20 h-20 mx-auto rounded-2xl shadow-md border border-gray-100 object-cover mb-4">
      
      <h3 class="text-xl font-extrabold text-gray-800 mb-2">Install Pdf Toolbox</h3>
      <p class="text-sm text-gray-500 mb-6 leading-relaxed">Tambahkan ke layar utama untuk akses lebih cepat, tanpa perlu buka browser lagi!</p>
      
      <!-- Tombol Aksi (Besar dan Jelas) -->
      <div class="flex flex-col space-y-3">
        <button id="install-btn" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:bg-blue-700 hover:shadow-xl transition transform hover:-translate-y-0.5">Install Sekarang</button>
        <button id="close-btn" class="w-full text-gray-400 text-sm font-medium hover:text-gray-600 transition">Mungkin Nanti</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. GENERATE MANIFEST.JSON SECARA DINAMIS
    // ==========================================
    const iconUrl = "https://cdn.phototourl.com/free/2026-09-15-9150f100-1206-4587-85bb-6716981d0b9f.png";
    const manifest = {
      "name": "Pdf Toolbox",
      "short_name": "Pdf Toolbox",
      "description": "Alat manajemen dan pemrosesan PDF",
      "start_url": window.location.href,
      "display": "standalone",
      "background_color": "#f3f4f6",
      "theme_color": "#2563eb",
      "icons": [
        {
          "src": iconUrl,
          "sizes": "192x192 512x512",
          "type": "image/png",
          "purpose": "any maskable"
        }
      ]
    };
    
    const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    const manifestUrl = URL.createObjectURL(manifestBlob);
    document.getElementById('manifest-link').setAttribute('href', manifestUrl);

    // ==========================================
    // 2. GENERATE SERVICE WORKER SECARA DINAMIS
    // ==========================================
    const swCode = `
      self.addEventListener('install', (event) => {
        self.skipWaiting();
      });
      self.addEventListener('activate', (event) => {
        event.waitUntil(clients.claim());
      });
      self.addEventListener('fetch', (event) => {
        event.respondWith(fetch(event.request).catch(() => new Response('Koneksi terputus')));
      });
    `;

    if ('serviceWorker' in navigator) {
      const swBlob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(swBlob);
      
      navigator.serviceWorker.register(swUrl)
        .then(() => console.log('Inline Service Worker berhasil didaftarkan.'))
        .catch(err => console.error('Gagal mendaftar Service Worker:', err));
    }

    // ==========================================
    // 3. LOGIKA PROMPT IKLAN E-COMMERCE STYLE
    // ==========================================
    let deferredPrompt;
    const overlay = document.getElementById('install-prompt-overlay');
    const box = document.getElementById('install-prompt-box');
    const installBtn = document.getElementById('install-btn');
    const closeBtn = document.getElementById('close-btn');
    const closeIconBtn = document.getElementById('close-icon-btn');

    function showModal() {
      overlay.classList.remove('hidden');
      setTimeout(() => {
        overlay.classList.remove('opacity-0');
        box.classList.remove('scale-90');
        box.classList.add('scale-100');
      }, 50);
    }

    function hideModal() {
      overlay.classList.add('opacity-0');
      box.classList.remove('scale-100');
      box.classList.add('scale-90');
      setTimeout(() => {
        overlay.classList.add('hidden');
      }, 300);
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      showModal();
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log(`Pilihan user: ${outcome}`);
        hideModal();
        deferredPrompt = null;
      }
    });

    closeBtn.addEventListener('click', hideModal);
    closeIconBtn.addEventListener('click', hideModal);

    window.addEventListener('appinstalled', () => {
      hideModal();
      console.log('Pdf Toolbox berhasil diinstal.');
    });
  </script>
</body>
</html>
